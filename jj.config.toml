#:schema https://docs.jj-vcs.dev/latest/config-schema.json

[user]
name = "hewigovens"
email = "360470+hewigovens@users.noreply.github.com"

[signing]
backend = "ssh"
behavior = "own"
key = "/Users/hewig/.ssh/sign_ed25519"

[git]
sign-on-push = true

[ui]
show-cryptographic-signatures = true

[fix.tools.rustfmt]
command = ["rustfmt", "--edition", "2024"]
patterns = ["glob:'**/*.rs'"]

[fix.tools.swiftformat]
command = ["swiftformat", "--stdinpath", "$path", "stdin"]
patterns = ["glob:'**/*.swift'"]

[merge-tools.zed]
program = "zed"
merge-args = ["--wait", "$output"]
merge-tool-edits-conflict-markers = true
conflict-marker-style = "git"
diff-args = ["--wait", "--diff", "$left", "$right"]

[aliases]
